<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>strong-loop — the loop on one screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--chip-w:150px;--paper:#EFF2F4;--paper-2:#F7F9FA;--ink:#15181D;--graphite:#59626E;--rule:#C7CED6;--code:#1F3A93;--model:#5B4B9E;--human:#8A5A00;
--supported:#0B7A55;--rejected:#B42318;--inconclusive:#B26A00;--refused:#475467;
--display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--body:"Source Serif 4",Georgia,serif;--mono:"IBM Plex Mono",Consolas,monospace;
--label-w:min(16.7rem,17vw)}
*{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden}
html{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:clamp(11px,1.5vh,15px);line-height:1.4}
body{display:grid;grid-template-rows:auto 1fr auto;padding:14px 22px 8px;gap:4px}
.mono{font-family:var(--mono)} .muted{color:var(--graphite)} .code-ink{color:var(--code)} .model-ink{color:var(--model)} .human-ink{color:var(--human)}
button{font:inherit;cursor:pointer}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.lede{margin:.3rem 0 0;font-size:.9rem;color:var(--graphite);max-width:66ch;line-height:1.35} .lede b{color:var(--ink);font-weight:600}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
.site-nav{display:flex;gap:1rem;font:600 .68rem var(--mono);text-transform:uppercase;letter-spacing:.05em}.site-nav a{color:var(--code);text-decoration:none}.site-nav a:hover{text-decoration:underline}
.kicker{font-family:var(--mono);font-size:.74rem;color:var(--graphite);letter-spacing:.02em;margin:0 0 .15rem}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:2.2rem;line-height:1;margin:0;white-space:nowrap}
.legend{display:flex;gap:.6rem;align-items:center;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--graphite);white-space:nowrap}
.who{padding:.12em .5em;border-radius:2px;color:#fff;font-weight:600} .who-code{background:var(--code)} .who-model{background:var(--model)} .who-human{background:var(--human)}
.legend .sep{width:1px;height:1em;background:var(--rule)}
#status{font-weight:600;color:var(--ink)}

/* stage */
#stage{position:relative;min-height:0}
#orbit{position:absolute;overflow:visible}
#orbit .ring{fill:none;stroke:var(--code);stroke-width:3}
#orbit .spoke{stroke:var(--code);stroke-width:1.5;fill:none;opacity:.75} #orbit .spoke.read{stroke-dasharray:3 4;opacity:.6} #orbit .spoke.out{stroke-dasharray:3 4}
#orbit .chev{fill:var(--code)}
#orbit .io{stroke-width:1.6;fill:none} #orbit .io.in{stroke:var(--human)} #orbit .io.out{stroke:var(--code)}
#orbit .io-t{font-family:var(--mono);font-weight:600;letter-spacing:.06em;text-transform:uppercase} #orbit .io-t.in{fill:var(--human)} #orbit .io-t.out{fill:var(--code)}
.pill{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--code);background:var(--paper);border:2px solid var(--code);border-radius:999px;padding:.22em .7em;line-height:1.2;z-index:3}
.pill.active{animation:pulse 1.1s ease-in-out infinite;background:var(--code);color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,58,147,.35)}50%{box-shadow:0 0 0 10px rgba(31,58,147,0)}}
@media (prefers-reduced-motion:reduce){.pill.active{animation:none}}
.outside{position:absolute;width:var(--label-w);z-index:2;border:0;background:none;text-align:left;padding:0;color:var(--ink)}
.outside.center{width:min(22.7rem,26vw)}
.outside .role{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:var(--model);margin:0 0 .15rem;font-weight:600}
.outside .say{margin:0;font-size:.88rem;line-height:1.3;color:var(--ink)} .outside .say em{color:var(--graphite);font-style:normal}
.outside .quote{margin:.2rem 0 0;font-size:.84rem;line-height:1.3;color:var(--ink);font-style:italic;height:3.9em;overflow:hidden}
.outside .spec{margin:.1rem 0 0;font-family:var(--mono);font-size:.66rem;color:var(--graphite);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:1em}
.outside.center{text-align:center} .outside.right{text-align:right}
.outside.center .quote{height:2.6em} .outside.center .spec{display:none}
.outside .empty{display:inline-block;border:1.5px dashed var(--model);border-radius:3px;padding:.3rem .7rem;color:var(--model);font-family:var(--mono);font-size:.7rem;letter-spacing:.03em}
.outside:hover .role,.outside:focus-visible .role{text-decoration:underline} .outside:focus-visible{outline:2px solid var(--model);outline-offset:4px;border-radius:2px}
.inside{position:absolute;transform:translate(-50%,-50%);z-index:2;background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;padding:.3rem .5rem;width:var(--chip-w);text-align:center;box-shadow:0 1px 0 rgba(21,24,29,.04)}
.inside .mech{font-family:var(--mono);font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;color:var(--code);margin:0 0 .25rem;line-height:1.25}
.inside .val{font-family:var(--mono);font-size:.64rem;color:var(--ink);margin:0;display:flex;flex-direction:column;gap:.15rem;align-items:center}
.inside .val span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
.verdict{display:inline-block;font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.06em;padding:.12em .45em;border-radius:2px;color:#fff;background:var(--refused)}
.v-supported,.v-recorded,.v-approved{background:var(--supported)} .v-rejected{background:var(--rejected)} .v-inconclusive{background:var(--inconclusive)} .v-refused,.v-read{background:var(--refused)} .v-proposed,.v-iteration{background:var(--code)}

/* centre: the ledger */
#ledger{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:13.2em;z-index:4;background:var(--paper-2);border:1.5px solid var(--code);border-radius:6px;padding:.6em .8em .55em;text-align:center;font-family:var(--mono);font-size:13.5px;cursor:pointer}
#ledger:focus-visible{outline:2px solid var(--code);outline-offset:3px}
#ledger h2{font-family:var(--display);font-weight:800;letter-spacing:.02em;font-size:1.15em;margin:0;color:var(--code)}
#ledger .sub{font-size:.66em;letter-spacing:.05em;text-transform:uppercase;color:var(--graphite);margin:.05em 0 .5em}
#ledger dl{display:grid;grid-template-columns:1fr 1fr;gap:.3em .5em;margin:0}
#ledger dl div{display:flex;flex-direction:column} #ledger dt{font-size:.64em;text-transform:uppercase;letter-spacing:.05em;color:var(--graphite)}
#ledger dd{margin:0;font-family:var(--display);font-weight:800;font-size:1.65em;line-height:1.05}
#ledger .foot{margin:.5em 0 0;padding-top:.4em;border-top:1px solid var(--rule);font-size:.7em;color:var(--graphite);display:flex;justify-content:space-between}
#ledger .foot b{color:var(--ink);font-weight:600}

/* side cards, in the band the diagonal labels leave free */
.side{position:absolute;top:50%;transform:translateY(-50%);width:min(21rem,22vw);z-index:5;font-size:.78rem;line-height:1.35}
.side.l{left:0} .side.r{right:0}
.card{display:block;width:100%;text-align:left;border:0;background:var(--paper-2);border-left:3px solid var(--rule);border-radius:0 4px 4px 0;padding:.5rem .7rem .55rem;color:var(--ink)}
.card:hover,.card:focus-visible{background:#fff} .card:focus-visible{outline:2px solid var(--code)}
.card.human{border-left-color:var(--human)} .card.code{border-left-color:var(--code)}
.card .eyebrow .io{font-family:var(--display);font-weight:800;font-size:1.25em;color:var(--ink);letter-spacing:.04em}
.card .eyebrow{display:flex;gap:.45em;align-items:baseline;font-family:var(--mono);font-size:.8em;letter-spacing:.05em;text-transform:uppercase;color:var(--graphite);margin:0 0 .3rem}
.card h3{font-family:var(--display);font-weight:700;font-size:1.25em;margin:0 0 .2em;letter-spacing:-.01em}
.card p{margin:0 0 .15rem} .card ul{margin:.2rem 0 0;padding:0;list-style:none} .card li{margin:0 0 .12rem;display:flex;gap:.45rem;align-items:baseline}
.card li .k{font-family:var(--mono);font-size:.85em;color:var(--graphite);white-space:nowrap;min-width:0} .card li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .std{font-family:var(--mono);font-size:.85em;color:var(--ink);margin-top:.3em;line-height:1.4} .card .std b{color:var(--code);font-weight:600} .card .std.human b{color:var(--human)}
.card.dim{opacity:.55}
.controls{display:flex;gap:.4rem;align-items:center;position:relative}
.controls button{font-family:var(--mono);font-size:.72rem;font-weight:600;padding:.35rem .7rem;border:1.5px solid var(--code);border-radius:3px;background:var(--code);color:#fff;white-space:nowrap}
.controls button.ghost{background:transparent;color:var(--code)} .controls button[disabled]{opacity:.45;cursor:default}
.controls button:focus-visible{outline:2px solid var(--code);outline-offset:2px}
#livebox{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:26rem;flex-direction:column;gap:.35rem;padding:.6rem;background:var(--paper-2);border:1px solid var(--rule);border-radius:4px;box-shadow:0 6px 24px rgba(21,24,29,.12)} #livebox.open{display:flex}
#livebox input{font-family:var(--mono);font-size:.72rem;padding:.35rem .5rem;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink);width:100%}
#livebox .row{display:flex;gap:.4rem;align-items:center;justify-content:space-between}
.hint{font-family:var(--mono);font-size:.64rem;color:var(--graphite);margin:0;text-align:right}

footer{font-family:var(--mono);font-size:.66rem;color:var(--graphite);display:flex;justify-content:space-between;gap:1rem;padding-top:6px;border-top:1px solid var(--rule)} footer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* modal */
dialog{border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);padding:0;width:min(880px,90vw);max-height:86vh;font:15px/1.5 var(--body)}
dialog::backdrop{background:rgba(21,24,29,.45)}
dialog .head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;padding:1rem 1.25rem .6rem;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper)}
dialog .head .eyebrow{display:flex;gap:.5rem;align-items:baseline;font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--graphite);margin:0 0 .3rem}
dialog h2{font-family:var(--display);font-weight:700;font-size:1.4rem;letter-spacing:-.02em;margin:0}
dialog .close{border:0;background:none;font-family:var(--mono);font-size:.8rem;color:var(--code);padding:.3rem .5rem}
dialog .body{padding:.8rem 1.25rem 1.25rem;overflow:auto;max-height:calc(86vh - 5rem)}
dialog p{margin:0 0 .8em;max-width:70ch} dialog h3{font-family:var(--display);font-size:1rem;color:var(--graphite);margin:1.2rem 0 .4rem}
dialog pre{font-family:var(--mono);font-size:.74rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--paper-2);border:1px solid var(--rule);border-radius:3px;padding:.8rem;margin:0 0 1rem}
dialog table{width:100%;border-collapse:collapse;font-size:.86rem;margin:0 0 1rem} dialog th{text-align:left;font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--graphite);padding:.3rem .5rem .3rem 0;border-bottom:1px solid var(--rule)}
dialog td{padding:.4rem .5rem .4rem 0;border-bottom:1px solid var(--rule);vertical-align:top} dialog td.mono{font-size:.78rem}
dialog .verdict{font-size:.7rem}
</style></head>
<body>
<header>
  <div><p class="kicker" id="kicker">strong-loop</p><h1>The agent proposes. <span class="code-ink">Code disposes.</span></h1><p class="lede" id="lede"></p></div>
  <div class="hright">
    <nav class="site-nav" aria-label="customer journey"><a href="/">Overview</a><a href="/showcase.html" aria-current="page">See it</a><a href="/loop.html">Understand it</a><a href="/live.html">Try it live</a></nav>
    <div class="legend"><span class="who who-model">model</span><span>outside · may say anything</span><span class="sep"></span><span class="who who-code">code</span><span>inside · alone writes the ledger</span><span class="sep"></span><span class="who who-human">human</span><span>signs the charter</span></div>
    <div class="controls"><span class="legend"><span id="status">recorded run</span></span><button id="replay">▶ replay the recorded run</button><button id="livetoggle" class="ghost">● live</button>
      <div id="livebox"><input id="url" value="/api/run" aria-label="responses endpoint"><input id="steer" value="Focus on the highest-priority accountability." aria-label="steer"><div class="row"><span class="hint" id="hint" style="text-align:left">the same events, read off the Responses stream</span><button id="go">start</button></div></div>
    </div>
  </div>
</header>

<main id="stage">
  <svg id="orbit" aria-hidden="true"></svg>
  <div id="stations"></div>
  <button id="ledger" data-modal="ledger" aria-label="open the ledger">
    <h2>LEDGER</h2><p class="sub">append-only · the only memory</p>
    <dl>
      <div><dt>hypotheses</dt><dd id="c-tested">0</dd></div>
      <div><dt>supported</dt><dd id="c-sup">0</dd></div>
      <div><dt>findings</dt><dd id="c-find">0</dd></div>
      <div><dt>actions</dt><dd id="c-act">0</dd></div>
    </dl>
    <p class="foot"><span>iteration <b id="c-iter">—</b></span><span>demoted <b id="c-dem">—</b></span></p>
  </button>

  <div class="side l"><button class="card human" data-modal="human" id="card-human"></button></div>
  <div class="side r"><button class="card code" data-modal="finalise" id="card-final"></button></div>
</main>

<footer><span id="foot-l"></span><span id="foot-r"></span></footer>

<dialog id="modal"><div class="head"><div><p class="eyebrow" id="m-eyebrow"></p><h2 id="m-title"></h2></div><button class="close" id="m-close" aria-label="close">esc · close</button></div><div class="body" id="m-body"></div></dialog>

<script id="run" type="application/json">/*RUN_JSON*/</script>
<script>
const RUN = JSON.parse(document.getElementById("run").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const trunc = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s; };
const fmtP = (p) => p == null ? "—" : (p < 0.001 ? p.toExponential(1) : p.toFixed(3));
const badge = (v) => `<span class="verdict v-${esc(String(v).toLowerCase())}">${esc(String(v).toUpperCase())}</span>`;
const READ_TOOLS = new Set(["get_progress","list_questions","get_charter","list_gates","get_data_profile","load_skill","web"]);

// ------------------------------------------------------------------ the six stations, clockwise from 12
const STATIONS = [
  {id:"boundary", name:"continue?", mech:"should_continue · reads the ledger", role:"the model remembers nothing",
   say:`<span class="empty">fresh context</span> <em>system prompt + steer + the ledger summary. Nothing else is remembered.</em>`},
  {id:"read", name:"read", mech:"read-only · nothing written", role:"reads, then picks a question",
   say:`<code class="mono">get_progress</code> first. It may choose which open question to work, <em>not invent one.</em>`},
  {id:"test", name:"test", mech:"gate · screen · test · decide", role:"commits a hypothesis",
   say:`Committed before its result is known. <em>No retro-fitting the claim.</em>`},
  {id:"challenge", name:"challenge", mech:"driver_effect · confound held", role:"names a confound",
   say:`SUPPORTED is not yet a finding. <em>Re-test the same subgroup holding a plausible confound constant.</em>`},
  {id:"record", name:"record", mech:"refused if unchallenged", role:"records the finding",
   say:`Names the evidence. <em>Confidence is derived, not self-assessed.</em>`},
  {id:"act", name:"act", mech:"authorise · right · cap · observe", role:"proposes an action",
   say:`Cites findings. <em>Code checks the right, the bar for that right, the cap and the observation plan.</em>`},
];
const WRITES = new Set(["test","challenge","record","act"]);

function buildStations(){
  const host = $("stations"); host.innerHTML = "";
  STATIONS.forEach((s, i) => {
    const anchor = i === 0 ? "center" : i === 3 ? "center" : (i < 3 ? "left" : "right");
    host.insertAdjacentHTML("beforeend",
      `<button class="outside ${anchor}" id="out-${s.id}" data-modal="${s.id}" aria-label="${esc(s.role)}"><p class="role">${esc(s.role)}</p><p class="say">${s.say}</p><p class="quote" id="q-${s.id}"></p><p class="spec" id="s-${s.id}"></p></button>` +
      `<div class="inside" id="in-${s.id}"><p class="mech">${esc(s.mech)}</p><p class="val" id="v-${s.id}">—</p></div>` +
      `<button class="pill" id="pill-${s.id}" data-modal="${s.id}" aria-label="${esc(s.name)}">${esc(s.name)}</button>`);
  });
}

function layout(){
  const st = $("stage").getBoundingClientRect(); const W = st.width, H = st.height;
  const R = Math.min(0.68 * H, 0.42 * W) / 2, cx = W / 2, cy = H / 2, pad = 30;
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  document.documentElement.style.setProperty("--chip-w", Math.round(Math.max(7.5 * rem, Math.min(10 * rem, R * 0.52))) + "px");
  let ledgerPx = Math.max(10, Math.min(0.9 * rem, R / 300 * 0.9 * rem)); $("ledger").style.fontSize = ledgerPx.toFixed(1) + "px";
  const svg = $("orbit");
  svg.style.left = (cx - R - pad) + "px"; svg.style.top = (cy - R - pad) + "px";
  svg.style.width = svg.style.height = (2 * R + 2 * pad) + "px";
  svg.setAttribute("viewBox", `${-R - pad} ${-R - pad} ${2 * R + 2 * pad} ${2 * R + 2 * pad}`);
  const card = $("ledger").getBoundingClientRect(); const cardR = Math.hypot(card.width, card.height) / 2 * 0.86;
  let g = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A93"/></marker><marker id="arrow-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A5A00"/></marker></defs>`;
  g += `<circle class="ring" cx="0" cy="0" r="${R}"/>`;
  STATIONS.forEach((s, i) => {
    const th = i * Math.PI / 3, sx = R * Math.sin(th), sy = -R * Math.cos(th);
    const ex = cardR * Math.sin(th), ey = -cardR * Math.cos(th);
    if (s.id === "boundary") g += `<line class="spoke out" x1="${ex}" y1="${ey}" x2="${sx}" y2="${sy + 16}" marker-end="url(#arrow)"/>`;
    else if (WRITES.has(s.id)) g += `<line class="spoke" x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" marker-end="url(#arrow)"/>`;
    else g += `<line class="spoke read" x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}"/>`;
    const tm = th + Math.PI / 6, mx = R * Math.sin(tm), my = -R * Math.cos(tm);
    g += `<path class="chev" d="M-7,-6 L3,0 L-7,6 z" transform="translate(${mx},${my}) rotate(${tm * 180 / Math.PI})"/>`;
  });
  // input → the loop → output, along the axis the stations leave free
  const hc = $("card-human").getBoundingClientRect(), fc = $("card-final").getBoundingClientRect();
  const inX = hc.right - st.left - cx + 8, outX = fc.left - st.left - cx - 8, fs = (0.62 * rem).toFixed(1);
  g += `<line class="io in" x1="${inX}" y1="0" x2="${-R - 12}" y2="0" marker-end="url(#arrow-h)"/><text class="io-t in" font-size="${fs}" x="${(inX - R - 12) / 2}" y="-9" text-anchor="middle">charter → questions</text>`;
  g += `<line class="io out" x1="${R + 12}" y1="0" x2="${outX}" y2="0" marker-end="url(#arrow)"/><text class="io-t out" font-size="${fs}" x="${(R + 12 + outX) / 2}" y="-9" text-anchor="middle">finalise → report.json</text>`;
  svg.innerHTML = g;
  STATIONS.forEach((s, i) => {
    const th = i * Math.PI / 3, x = cx + R * Math.sin(th), y = cy - R * Math.cos(th);
    const pill = $("pill-" + s.id); pill.style.left = x + "px"; pill.style.top = y + "px";
    // inside chip: as far out as it can sit with every corner inside the ring
    const chip = $("in-" + s.id); const a = chip.offsetWidth / 2, b = chip.offsetHeight / 2;
    let r = R; for (; r > 0; r -= 2) { if (Math.hypot(r * Math.abs(Math.sin(th)) + a, r * Math.abs(Math.cos(th)) + b) <= R - 14) break; }
    chip.style.left = (cx + r * Math.sin(th)) + "px"; chip.style.top = (cy - r * Math.cos(th)) + "px";
    // outside label: entirely in the outward quadrant of its station, so it never crosses the ring
    const out = $("out-" + s.id); const w = out.offsetWidth, h = out.offsetHeight, gx = pill.offsetWidth / 2 + 8; out.style.transform = "";
    if (i === 0) { out.style.left = (cx - w / 2) + "px"; out.style.top = (y - 18 - h) + "px"; }
    else if (i === 3) { out.style.left = (cx - w / 2) + "px"; out.style.top = (y + 18) + "px"; }
    else if (i === 1) { out.style.left = (x + gx) + "px"; out.style.top = (y + 12 - h) + "px"; }
    else if (i === 2) { out.style.left = (x + gx) + "px"; out.style.top = (y - 12) + "px"; }
    else if (i === 4) { out.style.left = (x - gx - w) + "px"; out.style.top = (y - 12) + "px"; }
    else { out.style.left = (x - gx - w) + "px"; out.style.top = (y + 12 - h) + "px"; }
  });
  // if a chip still touches the ledger card, shrink the card a little rather than let them overlap
  for (let k = 0; k < 6; k++) {
    const L = $("ledger").getBoundingClientRect();
    const hit = [...document.querySelectorAll(".inside")].some(c => { const r = c.getBoundingClientRect(); return r.left < L.right - 1 && L.left < r.right - 1 && r.top < L.bottom - 1 && L.top < r.bottom - 1; });
    if (!hit) break; ledgerPx -= 0.5; $("ledger").style.fontSize = ledgerPx.toFixed(1) + "px";
  }
}

// ------------------------------------------------------------------ state + apply(event): one path for replay and live
const state = {tested:0, sup:0, find:0, act:0, iter:"—", max:"—", dem:"—", verdicts:{}};
let activePill = null;
function setActive(id){ if (activePill) activePill.classList.remove("active"); activePill = id ? $("pill-" + id) : null; if (activePill) activePill.classList.add("active"); }
function counts(){ $("c-tested").textContent = state.tested; $("c-sup").textContent = state.sup; $("c-find").textContent = state.find; $("c-act").textContent = state.act; $("c-iter").textContent = state.iter === "—" ? "—" : `${state.iter} / ${state.max}`; $("c-dem").textContent = state.dem; }
function show(id, {val, quote, spec}){ if (val != null) $("v-" + id).innerHTML = val; if (quote != null) $("q-" + id).textContent = quote; if (spec != null) $("s-" + id).textContent = spec; }
function reset(){
  Object.assign(state, {tested:0, sup:0, find:0, act:0, iter:"—", max:"—", dem:"—", verdicts:{}}); counts(); setActive(null);
  STATIONS.forEach(s => show(s.id, {val:"—", quote:"", spec:""}));
  $("card-final").classList.add("dim"); renderFinal(null);
}

function apply(ev){
  if (ev.kind === "iteration_start") {
    state.iter = ev.iteration; state.max = ev.max_iterations; counts(); setActive("boundary");
    const s = ev.summary || {hypotheses_tested: state.tested, findings: {length: state.find}};
    show("boundary", {val: `${badge("iteration " + ev.iteration + "/" + ev.max_iterations)} <span>begins with an empty context</span>`,
      quote: `handed a summary: ${s.hypotheses_tested ?? state.tested} tested, ${(s.findings || []).length ?? state.find} findings`});
    return;
  }
  if (ev.kind === "iteration_end") {
    setActive("boundary");
    const m = /tested (\d+), newly supported (\d+)/.exec(ev.line || ""); const tested = ev.tested ?? (m && m[1]) ?? "?", sup = ev.newly_supported ?? (m && m[2]) ?? "?";
    show("boundary", {val: `${badge("iteration " + (ev.iteration ?? state.iter) + "/" + state.max)} <span>${esc(tested)} tested · ${esc(sup)} supported</span>`, quote: `should_continue read the ledger · stagnant ${ev.stagnant ?? 0}, idle ${ev.idle ?? 0}`});
    return;
  }
  if (ev.kind === "report") {
    setActive(null); const r = ev.report || {};
    state.dem = r.demoted_by_multiple_testing ?? r.demoted ?? 0; counts();
    $("card-final").classList.remove("dim"); renderFinal(r);
    return;
  }
  const {tool, args = {}, result} = ev; const res = (result && typeof result === "object") ? result : {};
  if (READ_TOOLS.has(tool) || !["test_hypothesis","record_finding","propose_action"].includes(tool)) {
    setActive("read");
    show("read", {val: `${badge(tool === "load_skill" ? "skill" : "read")} <span>${esc(args.skill_name || tool)}</span>`,
      quote: tool === "load_skill" ? "method guidance from the toolbox — context, never evidence" : ""});
    return;
  }
  if (tool === "test_hypothesis") {
    const kind = args.kind || ""; const id = kind === "driver_effect" ? "challenge" : "test"; setActive(id);
    const spec = args.spec || {}; const specLine = Object.entries(spec).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join("  ");
    if (res.status === "tested") {
      state.tested++; state.verdicts[res.verdict] = (state.verdicts[res.verdict] || 0) + 1; if (res.verdict === "SUPPORTED") state.sup++; counts();
      const led = (RUN.ledger.evidence || {})[res.evidence_id] || {}; const stats = res.statistics || led.statistics || {};
      let val;
      if (res.verdict === "REFUSED") val = `${badge("refused")} <span>${esc(trunc(res.refusal_reason || "constraint", 26))}</span>`;
      else if (id === "challenge") {
        const frac = stats.confound_explains_fraction; const ctl = stats.control || spec.control || "confound";
        val = `${badge(res.verdict)} <span>${esc(ctl)} · ${typeof frac === "number" ? Math.round(frac * 100) + "%" : "?"}</span>`;
      } else val = `${badge(res.verdict)} <span>${(res.effect_size ?? 0).toFixed(2)}× · n ${(res.sample_size ?? 0).toLocaleString()}</span>`;
      show(id, {val, quote: `“${args.statement || ""}”`, spec: specLine});
    } else show(id, {val: `${badge(res.status || "refused")} <span>${esc(trunc(res.message || "", 28))}</span>`, quote: `“${args.statement || ""}”`, spec: specLine});
    return;
  }
  if (tool === "record_finding") {
    setActive("record"); const f = (RUN.ledger.findings || {})[res.finding_id];
    if (res.status === "recorded") { state.find++; counts(); show("record", {val: `${badge("recorded")} <span>confidence ${Number(res.confidence).toFixed(2)}</span>`, quote: f ? `“${f.headline}”` : `evidence ${args.evidence_id || ""}`, spec: `evidence ${args.evidence_id || ""}`}); }
    else show("record", {val: `${badge(res.status || "refused")} <span>${esc(trunc(res.message || "", 26))}</span>`, quote: trunc(res.message || "", 140), spec: `evidence ${args.evidence_id || ""}`});
    return;
  }
  if (tool === "propose_action") {
    setActive("act"); const st = res.status || "refused"; if (st === "approved" || st === "proposed") state.act++; counts();
    const a = (RUN.ledger.actions || []).find(x => x.id === res.action_id);
    const reasons = ((res.authorisation || {}).reasons || []).join("; ");
    show("act", {val: `${badge(st)} <span>${esc((res.autonomy_level || args.action_type || "").replace(/_/g, " "))}</span>`,
      quote: `“${args.recommendation || (a && a.recommendation) || args.action_type || ""}”`, spec: `${args.action_type || ""} · ${reasons || (res.message || "")}`});
    return;
  }
}

function fromTrace(ev){
  if (ev.event === "iteration_start") return {kind:"iteration_start", iteration: ev.iteration, max_iterations: ev.max_iterations};
  if (ev.event === "iteration_end") return {kind:"iteration_end", ...ev};
  if (ev.event === "report") return {kind:"report", report: RUN.report};
  let res = ev.result; if (typeof res === "string") { try { res = JSON.parse(res); } catch { res = {status: "read"}; } }
  return {kind:"tool", tool: ev.tool, args: ev.args || {}, result: res};
}

// ------------------------------------------------------------------ corners
function renderHuman(){
  const s = RUN.standard;
  const acc = RUN.accountabilities.map(a => `${esc(a.metric)} ${a.direction === "decrease" ? "↓" : a.direction === "increase" ? "↑" : "="}`).join(" · ");
  const rights = RUN.rights.map(r => `${esc(r.action_type)} <b>${esc(r.autonomy_level.split("_")[0])}</b> ≤${r.max_per_run}`).join(" · ");
  $("card-human").innerHTML = `<p class="eyebrow"><span class="io">input</span><span class="who who-human">human</span><span>signs · ${esc(RUN.charter_file)}</span></p>
    <h3>${esc(RUN.role)}</h3>
    <p class="std human">accountable for <b>${acc}</b></p>
    <p class="std human">may ${rights}</p>
    <p class="std human">proof n ≥ <b>${s.min_sample_size}</b> · p &lt; <b>${s.max_p_value}</b> · effect ≥ <b>${s.min_effect_size}×</b> · <b>${esc(s.correction === "benjamini_hochberg" ? "BH" : s.correction)}</b></p>
    <p class="std muted">${esc(RUN.dataset.name)} · ${RUN.dataset.rows.toLocaleString()} rows → ${RUN.questions.length} questions compiled before any model call</p>`;
}
function renderFinal(r){
  const el = $("card-final");
  if (!r) { el.innerHTML = `<p class="eyebrow"><span class="io">output</span><span class="who who-code">code</span><span>report.json</span></p><h3>written when the run completes</h3><p class="muted" style="font-size:.95em">findings, actions, and every p-value corrected together</p>`; return; }
  const finds = (r.findings || []).map(f => `<li><span class="k">${Number(f.confidence).toFixed(2)}</span><span class="t">${esc(f.headline)}</span></li>`).join("");
  const acts = (r.actions || []).map(a => `<li><span class="k">${badge(a.status)}</span><span class="t">${esc(a.type)} · ${esc(a.autonomy)}</span></li>`).join("");
  const nAct = (r.actions || []).filter(a => a.status === "approved" || a.status === "proposed").length;
  el.innerHTML = `<p class="eyebrow"><span class="io">output</span><span class="who who-code">code</span><span>report.json</span></p>
    <h3>${(r.findings || []).length} findings · ${nAct} authorised action${nAct === 1 ? "" : "s"}</h3>
    <ul>${finds || "<li class='muted'>no findings</li>"}</ul><ul style="margin-top:.3em">${acts || "<li class='muted'>no actions</li>"}</ul>
    <p class="std muted">finalise: ${r.hypotheses_tested} p-values corrected together · ${r.demoted_by_multiple_testing ?? 0} demoted</p>`;
}

// ------------------------------------------------------------------ modals
const M = {
  human: () => ["human", "input · the role charter, verbatim", `<p>The charter says what the role is accountable for, what it may do, what counts as proof and what it must not touch. It cannot say which questions to ask. Nothing in the engine mentions ${esc(RUN.role.split("_")[0])}s: the same code ran a different charter over a different file with zero changes.</p><p class="mono muted" style="font-size:.8rem">${esc(RUN.dataset.name)} · ${RUN.dataset.rows.toLocaleString()} rows · ${RUN.dataset.columns} columns · the model never opens it; it sees a profile and the gate scores the rows on its behalf.</p><pre>${esc(RUN.charter_yaml)}</pre>`],
  boundary: () => { const c = RUN.constants; return ["code", "iteration boundary · fresh context + ledger summary", `<p>Each iteration is a new context: the system prompt, the human's steer and a header carrying the ledger summary. Nothing else. <code>should_continue</code> reads the ledger, never the model's text: ${c.idle_patience} consecutive iterations that test nothing, or ${c.patience} that add no supported evidence, end the run after a minimum of ${c.min_iterations}. Below, the exact header each iteration received.</p>` + Object.entries(RUN.headers).map(([n, t]) => `<h3>iterations/${esc(n)}.md</h3><pre>${esc(t)}</pre>`).join("")]; },
  read: () => ["model", "read-only · the questions it inherits", `<p>Before any model call, one question per accountability is compiled from the charter and appended to the ledger. The agent may pick which open question to work, and may not invent a new one. The read tools (<span class="mono">get_progress, list_questions, get_charter, list_gates, get_data_profile, load_skill</span>) write nothing.</p><table><thead><tr><th>id</th><th>question</th><th>why it matters</th></tr></thead><tbody>${RUN.questions.map(q => `<tr><td class="mono">${esc(q.id)}</td><td>${esc(q.text)}</td><td class="muted">${esc(q.why)}</td></tr>`).join("")}</tbody></table>`],
  test: () => { const s = RUN.standard; const rows = testRows(k => k !== "driver_effect"); return ["code", "the gate · screen, test, decide", `<p>The <code>where</code> clause is parsed as an AST and screened (no calls, attributes or subscripts; no unknown, sensitive, forbidden or target-leaking columns). Then a gate runs and <code>decide</code> applies the charter's standard: n ≥ ${s.min_sample_size}, p &lt; ${s.max_p_value}, effect ≥ ${s.min_effect_size}×. INCONCLUSIVE is first-class: an underpowered test is not a false one.</p><table><thead><tr><th>gate</th><th>question shape</th></tr></thead><tbody>${RUN.gates.map(g => `<tr><td class="mono">${esc(g.name)}</td><td>${esc(g.question_shape)}</td></tr>`).join("")}</tbody></table><pre>${esc(RUN.source.decide)}</pre><h3>Every test in this run</h3>${rows}`]; },
  challenge: () => { const ev = Object.entries(RUN.ledger.evidence).filter(([, e]) => e.gate === "driver_effect"); const rows = ev.map(([, e]) => { const h = RUN.ledger.hypotheses[e.hypothesis_id] || {spec: {}}; const f = e.statistics.confound_explains_fraction; return `<tr><td class="mono">${esc(h.spec.where || "")}</td><td class="mono">${esc(h.spec.control || "")}</td><td>${badge(e.verdict)}</td><td class="mono">${esc(String(e.statistics.adjusted_odds_ratio ?? "—"))}</td><td class="mono">${typeof f === "number" ? Math.round(f * 100) + "%" : "—"}</td></tr>`; }).join(""); return ["code", "the challenge · driver_effect", `<p>SUPPORTED means the effect is unlikely to be noise. It does not mean the attribute the model named is the reason. So the same subgroup is re-tested holding a plausible confound constant. The bar is that a confound was named and tested, not that the finding survived; a challenge that fails is as informative as one that succeeds.</p><table><thead><tr><th>subgroup</th><th>control</th><th>verdict</th><th>adjusted OR</th><th>explained by confound</th></tr></thead><tbody>${rows || "<tr><td colspan=5>none</td></tr>"}</tbody></table>`]; },
  record: () => ["code", "record_finding · refuses an unchallenged subgroup", `<p>The instruction to challenge is in the prompt too, but a prompt is not a mechanism; this is. A subgroup finding is refused until a driver_effect test exists for the same <code>where</code>, and refused again if the confound explains half or more of the association.</p><pre>${esc(RUN.source.unchallenged)}</pre><h3>Findings this run recorded</h3><table><thead><tr><th>confidence</th><th>headline</th><th>evidence</th></tr></thead><tbody>${Object.values(RUN.ledger.findings).map(f => `<tr><td class="mono">${Number(f.confidence).toFixed(3)}</td><td>${esc(f.headline)}<br><span class="muted" style="font-size:.85em">${esc(f.interpretation)}</span></td><td class="mono">${esc(f.evidence_id)}</td></tr>`).join("")}</tbody></table>`],
  act: () => ["code", "authorise_action · no action without a right, evidence for that right, a cap and a way to observe it", `<p>The gate decides whether something is true; this decides whether the role may act on it. Four checks in fixed code: the charter names the action type; every cited finding clears the standard for that type; the blast radius is within cap; there is a plan to measure the result. Autonomy is granted per action type by the charter, never chosen by the model.</p><h3>What this charter grants</h3><table><thead><tr><th>action type</th><th>autonomy</th><th>cap</th><th>observed by</th><th>needs</th></tr></thead><tbody>${RUN.rights.map(r => `<tr><td class="mono">${esc(r.action_type)}<br><span class="muted" style="font-size:.85em;font-family:var(--body)">${esc(r.description)}</span></td><td class="mono">${esc(r.autonomy_level)}</td><td class="mono">${r.max_per_run} ${esc(r.unit)}</td><td class="mono">${esc(r.observation_metric || "—")}</td><td>${esc(r.requires_authority || "—")}</td></tr>`).join("")}</tbody></table><h3>Actions this run produced</h3><table><thead><tr><th>type</th><th>status</th><th>recommendation</th><th>blast radius · observation</th><th>reasons</th></tr></thead><tbody>${RUN.ledger.actions.map(a => `<tr><td class="mono">${esc(a.action_type)}</td><td>${badge(a.status)}<br><span class="mono muted" style="font-size:.75em">${esc(a.autonomy_level)}</span></td><td>${esc(a.recommendation)}</td><td class="mono">${esc(JSON.stringify(a.blast_radius))}<br>${esc(JSON.stringify(a.observation_plan))}</td><td>${a.reasons.map(esc).join("<br>")}</td></tr>`).join("") || "<tr><td colspan=5>none</td></tr>"}</tbody></table>`],
  finalise: () => ["code", "finalise · the whole run, corrected", `<p>Every p-value from the run is corrected together (${esc(RUN.standard.correction)}), and a result that was only lucky is demoted before anyone reads it. ${RUN.report.demoted_by_multiple_testing} were demoted in this run.</p><pre>${esc(JSON.stringify(RUN.report, null, 2))}</pre>`],
  ledger: () => ["code", "the ledger · every record, in order", `<p>What the platform believes, as an append-only file. A hypothesis is written before its result is known; the verdict beside it was written by code. This is the only memory carried between iterations.</p>${testRows(() => true)}`],
};
function testRows(keep){
  const rows = Object.entries(RUN.ledger.evidence).filter(([, e]) => keep(e.gate)).map(([, e]) => { const h = RUN.ledger.hypotheses[e.hypothesis_id] || {}; const stats = e.verdict === "REFUSED" ? esc(e.refusal_reason || "") : `${e.effect != null ? e.effect.toFixed(2) + "×" : "—"} · p ${fmtP(e.p)} · n ${(e.n ?? 0).toLocaleString()}`; return `<tr><td>${badge(e.verdict)}</td><td class="mono">${esc(e.gate)}</td><td>“${esc(h.statement || "")}”<br><span class="mono muted" style="font-size:.78em">${esc(Object.entries(h.spec || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join("  "))}</span></td><td class="mono">${stats}</td></tr>`; }).join("");
  return `<table><thead><tr><th>verdict</th><th>gate</th><th>the model wrote</th><th>code measured</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function openModal(key){
  const f = M[key]; if (!f) return; const [who, title, body] = f();
  $("m-eyebrow").innerHTML = `<span class="who who-${who}">${who}</span><span>${esc(RUN.role)} · ${esc(RUN.run_dir.split("/").pop())}</span>`;
  $("m-title").textContent = title; $("m-body").innerHTML = body; $("m-body").scrollTop = 0; $("modal").showModal();
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-modal]"); if (b) openModal(b.dataset.modal); });
$("m-close").addEventListener("click", () => $("modal").close());
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) $("modal").close(); });

// ------------------------------------------------------------------ replay
let replaying = false, live = false;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const pace = (ev) => ev.kind === "tool" ? (READ_TOOLS.has(ev.tool) ? 260 : 950) : (ev.kind === "report" ? 500 : 750);
async function replay(){
  if (replaying || live) return; replaying = true; $("replay").disabled = true; $("status").textContent = "replaying the recorded run";
  reset();
  for (const raw of RUN.trace) { const ev = fromTrace(raw); apply(ev); await sleep(pace(ev)); }
  $("status").textContent = "recorded run · complete"; replaying = false; $("replay").disabled = false;
}
$("replay").addEventListener("click", replay);

// ------------------------------------------------------------------ live: the same events, read off the Responses stream
$("livetoggle").addEventListener("click", () => $("livebox").classList.toggle("open"));
const calls = new Map();
function onItem(item){
  if (item.type === "function_call") { let args = {}; try { args = JSON.parse(item.arguments || "{}"); } catch {} calls.set(item.call_id, {name: item.name || "?", args}); return; }
  if (item.type !== "function_call_output") return;
  const c = calls.get(item.call_id); if (!c) return; let out = null; try { out = JSON.parse(item.output); } catch { out = item.output; }
  if (c.name === "loop.iteration_start") return apply({kind:"iteration_start", iteration: c.args.iteration, max_iterations: c.args.max_iterations, summary: (out || {}).ledger_summary});
  if (c.name === "loop.iteration_end") return apply({kind:"iteration_end", iteration: c.args.iteration, ...(out || {})});
  if (c.name === "loop.report") { apply({kind:"report", report: out || {}}); $("status").textContent = "live · complete"; return; }
  apply({kind:"tool", tool: c.name, args: c.args, result: out});
}
function handleBlock(block){
  let type = null, data = null;
  for (const line of block.split("\n")) { if (line.startsWith("event: ")) type = line.slice(7); else if (line.startsWith("data: ")) { try { data = JSON.parse(line.slice(6)); } catch {} } }
  if (!type || !data) return;
  if (type === "response.output_item.done") onItem(data.item);
  else if (type === "response.completed") { if (!/complete/.test($("status").textContent)) $("status").textContent = "live · stream ended"; }
  else if (type === "error") $("status").textContent = "live · error: " + JSON.stringify(data).slice(0, 80);
}
async function startLive(){
  if (live || replaying) return; live = true; $("go").disabled = true; $("replay").disabled = true; calls.clear(); reset(); $("status").textContent = "live · connecting";
  try {
    const res = await fetch($("url").value, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({model:"strong-loop", input: $("steer").value, stream:true})});
    if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
    $("status").textContent = "live · streaming";
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) { const {value, done} = await reader.read(); if (done) break; buf += dec.decode(value, {stream:true}); let i; while ((i = buf.indexOf("\n\n")) >= 0) { handleBlock(buf.slice(0, i)); buf = buf.slice(i + 2); } }
  } catch (e) { $("status").textContent = "live · failed: " + e.message; $("hint").textContent = `${e.message} — is the agent running there? locally: python main.py`; $("livebox").classList.add("open"); }
  finally { live = false; $("go").disabled = false; $("replay").disabled = false; setActive(null); }
}
$("go").addEventListener("click", startLive);

// ------------------------------------------------------------------ boot: the recorded run's end state, instantly
$("kicker").textContent = `strong-loop · a recorded run · ${RUN.role} over ${RUN.dataset.name} · ${RUN.dataset.rows.toLocaleString()} rows · ${RUN.report.iterations_run} iterations`;
$("foot-l").textContent = `generated ${RUN.generated_at} from ${RUN.run_dir} by tools/make_showcase.py · no hand-written numbers`;
$("foot-r").textContent = "loop.html walks the same run in full · live.html is the raw stream";
const C = RUN.constants;
$("lede").innerHTML = `<b>One turn is one run. One run is N fresh contexts over one ledger.</b> The ring is the boundary: the model proposes outside it, code decides inside it, and only code writes. Click any station, the ledger or a card for the record behind it.`;
buildStations(); renderHuman(); reset(); layout();
for (const raw of RUN.trace) apply(fromTrace(raw)); setActive(null); $("status").textContent = "recorded run";
window.addEventListener("resize", layout);
</script>
</body></html>
